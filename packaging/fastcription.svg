<?xml version="1.0" encoding="UTF-8"?>
<!-- fastcription's mark: three bars of a spectrum, which is what the app
     draws for the audio it is listening to. Scalable, so one file serves
     every icon size a desktop asks for. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bar" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3ce2ff"/>
      <stop offset="1" stop-color="#b06cff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="#080a10"/>
  <rect x="8" y="8" width="112" height="112" rx="22" fill="none"
        stroke="#3ce2ff" stroke-opacity="0.18" stroke-width="2"/>
  <g filter="url(#glow)">
    <rect x="30" y="62" width="14" height="36" rx="7" fill="url(#bar)"/>
    <rect x="57" y="30" width="14" height="68" rx="7" fill="url(#bar)"/>
    <rect x="84" y="50" width="14" height="48" rx="7" fill="url(#bar)"/>
  </g>
</svg>
