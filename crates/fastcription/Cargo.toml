[package]
name = "fastcription"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "fastcription"
path = "src/main.rs"

[dependencies]
fc-core = { workspace = true }
fc-store = { workspace = true }
fc-audio = { workspace = true }
fc-asr = { workspace = true }
fc-voxtype = { workspace = true }
fc-export = { workspace = true }
anyhow = { workspace = true }
crossbeam-channel = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true }
serde = { workspace = true }

eframe = { version = "0.36.1", default-features = false, features = ["glow", "wayland", "x11", "persistence"] }
egui = { version = "0.36.1", default-features = false, features = ["default_fonts"] }
egui_extras = { version = "0.36.1", default-features = false, features = ["svg"] }

fastframe-log = { git = "https://github.com/crmne/fastframe", rev = "bb79dbd", default-features = false }
fastframe-instance = { git = "https://github.com/crmne/fastframe", rev = "bb79dbd" }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", rev = "bb79dbd" }
fastframe-text = { git = "https://github.com/crmne/fastframe", rev = "bb79dbd" }
fastframe-scroll = { git = "https://github.com/crmne/fastframe", rev = "bb79dbd" }
fastframe-icons = { git = "https://github.com/crmne/fastframe", rev = "bb79dbd" }
fastframe-theme = { git = "https://github.com/crmne/fastframe", rev = "bb79dbd" }
fastframe-shell = { git = "https://github.com/crmne/fastframe", rev = "bb79dbd" }
fastframe-tray = { git = "https://github.com/crmne/fastframe", rev = "bb79dbd" }
