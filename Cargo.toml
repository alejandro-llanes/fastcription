[workspace]
members = [
    "crates/fc-core",
    "crates/fc-store",
    "crates/fc-audio",
    "crates/fc-asr",
    "crates/fc-voxtype",
    "crates/fc-export",
    "crates/fastcription",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/alejandro-llanes/fastcription"

[workspace.dependencies]
fc-core = { path = "crates/fc-core" }
fc-store = { path = "crates/fc-store" }
fc-audio = { path = "crates/fc-audio" }
fc-asr = { path = "crates/fc-asr" }
fc-voxtype = { path = "crates/fc-voxtype" }
fc-export = { path = "crates/fc-export" }

anyhow = "1"
thiserror = "2"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
hound = "3"
notify = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "7"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
tempfile = "3"
toml = "0.9"
# No TLS: the meaning server is on the user's own network, like the
# transcription server, and the TLS stack is most of the crate.
ureq = { version = "2", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
strip = "debuginfo"

# Owned by crates/fastcription: the fork pins fastframe's README requires for
# any app built on it. Patch every egui crate fastcription actually depends on
# from one revision — Cargo warns about a patch for a crate that is unused —
# and move egui and winit together, since the egui revision is built against
# this exact winit.
[patch.crates-io]
eframe = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui_extras = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
emath = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
epaint = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
winit = { git = "https://github.com/crmne/winit", rev = "ed7caa9023f10b397f5b6ec8284a840cbd8a6f65" }
