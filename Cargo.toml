[workspace]
members = [
    "crates/fc-core",
    "crates/fc-store",
    "crates/fc-audio",
    "crates/fc-asr",
    "crates/fc-voxtype",
    "crates/fc-export",
    "crates/fastcription",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/sombralibre/fastcription"

[workspace.dependencies]
fc-core = { path = "crates/fc-core" }
fc-store = { path = "crates/fc-store" }
fc-audio = { path = "crates/fc-audio" }
fc-asr = { path = "crates/fc-asr" }
fc-voxtype = { path = "crates/fc-voxtype" }
fc-export = { path = "crates/fc-export" }

anyhow = "1"
thiserror = "2"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
hound = "3"
notify = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "7"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = "debuginfo"
